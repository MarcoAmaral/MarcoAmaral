                    </path>
    <text font-family='"IBM Plex Mono", monospace' fill='#CFE0FF' font-size='17'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            › QA strategy: what to test and when to ship
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4200ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h640 ; m0,25 h640 ; m0,25 h0' keyTimes='0;0.53333333333333;0.86666666666667;1' />
                    </path>
    <text font-family='"IBM Plex Mono", monospace' fill='#CFE0FF' font-size='17'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            › Playwright automation your team will run
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='4200ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h640 ; m0,25 h640 ; m0,25 h0' keyTimes='0;0.53333333333333;0.86666666666667;1' />
                    </path>
    <text font-family='"IBM Plex Mono", monospace' fill='#CFE0FF' font-size='17'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            › QA audits with a prioritized bug report
        </textPath>
    </text>
        <path id='path3'>
                            <!-- Single line -->
                                <animate id='d3' attributeName='d' begin='d2.end'
                    dur='4200ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h640 ; m0,25 h640 ; m0,25 h0' keyTimes='0;0.53333333333333;0.86666666666667;1' />
                    </path>
    <text font-family='"IBM Plex Mono", monospace' fill='#CFE0FF' font-size='17'
        dominant-baseline='middle'
