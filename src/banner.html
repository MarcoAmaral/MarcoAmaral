<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root { --bg:#f7f8fa; --card:#ffffff; --ink:#13233f; --muted:#556479; --rule:#d5dae2; --rule2:#c2c9d4; --green:#0f7b5c; }
  :root.dark { --bg:#0f1b31; --card:#14233d; --ink:#eef2f7; --muted:#a3b3c9; --rule:#2b3d5c; --rule2:#3a4f72; --green:#3ccf9a; }
  html, body { margin: 0; width: 1280px; height: 320px; background: transparent; }
  .b { position: relative; width: 1280px; height: 320px; background: var(--bg); color: var(--ink); overflow: hidden; border-radius: 8px; font-family: 'Public Sans', sans-serif; }
  .v, .h { position: absolute; }
  .v { top: 0; bottom: 0; border-left: 1px solid var(--rule); }
  .h { left: 0; right: 0; border-top: 1px solid var(--rule); }
  .plus { position: absolute; font: 300 22px/1 'IBM Plex Mono', monospace; color: var(--muted); background: var(--bg); padding: 0 1px; }
  .txt { position: absolute; left: 90px; top: 50%; transform: translateY(-50%); width: 660px; display: flex; flex-direction: column; gap: 14px; }
  .name { font: 700 15px/1 'Public Sans'; letter-spacing: .09em; text-transform: uppercase; }
  .head { font: 600 47px/1.04 'Public Sans'; letter-spacing: -0.035em; }
  .sub { font: 500 13.5px/1.3 'IBM Plex Mono', monospace; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .pipe { position: absolute; right: 102px; top: 50%; transform: translateY(-50%); width: 308px; border: 1px solid var(--rule2); background: var(--card); font-family: 'IBM Plex Mono', monospace; }
  .pipe .top { display: flex; justify-content: space-between; padding: 11px 15px; border-bottom: 1px solid var(--ink); font: 500 11px/1 'IBM Plex Mono'; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .rows { padding: 11px 15px 13px; display: flex; flex-direction: column; gap: 7px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 12px; line-height: 1; }
  .row span:first-child { width: 115px; }
  .row i { flex: 1; height: 4px; background: var(--green); }
  .row b { color: var(--green); font-weight: 500; }
  .stamp { position: absolute; right: 80px; top: 208px; transform: rotate(-8deg); border: 4px solid var(--green); border-radius: 6px; corner-shape: superellipse(2); padding: 6px 15px; font: 800 13.5px/1.1 'Public Sans'; letter-spacing: .1em; text-transform: uppercase; color: var(--green); background: var(--card); }
</style>
</head>
<body>
<div class="b">
  <span class="v" style="left:51px"></span><span class="v" style="right:51px"></span>
  <span class="h" style="top:54px"></span><span class="h" style="bottom:54px"></span>
  <span class="plus" style="left:51px;top:54px;transform:translate(-50%,-52%)">+</span>
  <span class="plus" style="right:51px;top:54px;transform:translate(50%,-52%)">+</span>
  <span class="plus" style="left:51px;bottom:54px;transform:translate(-50%,48%)">+</span>
  <span class="plus" style="right:51px;bottom:54px;transform:translate(50%,48%)">+</span>
  <div class="txt">
    <span class="name">Marco Amaral · Senior QA Engineer</span>
    <span class="head">Find the bugs before your customers do.</span>
    <span class="sub">Playwright · QA strategy · AI-assisted QA · EN / PT-BR</span>
  </div>
  <div class="pipe">
    <div class="top"><span>release-pipeline</span><span>main</span></div>
    <div class="rows">
      <div class="row"><span>lint</span><i></i><b>✓ pass</b></div>
      <div class="row"><span>unit</span><i></i><b>✓ pass</b></div>
      <div class="row"><span>e2e · playwright</span><i></i><b>✓ pass</b></div>
      <div class="row"><span>a11y · axe</span><i></i><b>✓ pass</b></div>
      <div class="row"><span>risk gate · p0</span><i></i><b>✓ pass</b></div>
    </div>
  </div>
  <span class="stamp">Approved for release</span>
</div>
<script>if (location.search.includes('dark')) document.documentElement.classList.add('dark');</script>
</body>
</html>
